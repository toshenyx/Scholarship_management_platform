<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | Scholarly</title>


    <link
        rel="stylesheet"
        href="signin.css"
    >

</head>


<body>


    <main class="signin-page">


        <!-- =====================================
             SCHOLARLY LOGO
        ====================================== -->

        <a
            href="../landing/landing.html"
            class="signin-brand"
        >

            <img
                src="../images/logo3.png"
                alt="Scholarly logo"
                class="signin-logo"
            >

            <span class="brand-name">
                scholarly
            </span>

        </a>



        <!-- =====================================
             RESET PASSWORD CARD
        ====================================== -->

        <div class="signin-card">


            <!-- Header -->

            <div class="signin-header">

                <h1>
                    Reset Your Password
                </h1>

            </div>



            <!-- =====================================
                 RESET PASSWORD FORM
            ====================================== -->

            <form
                id="reset-form"
                novalidate
            >


                <!-- Username / Email -->

                <div class="form-group">

                    <label for="identifier">
                        Username / Email
                    </label>

                    <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        placeholder="Enter your username or email"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- New Password -->

                <div class="form-group">

                    <label for="new-password">
                        New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="new-password"
                            name="new_password"
                            placeholder="Enter your new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="new-password"
                            aria-label="Show or hide password"
                        >
                            👁
                        </button>

                    </div>

                    <p class="password-hint">
                        Password must be at least 8 characters.
                    </p>

                </div>



                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirm-password">
                        Confirm New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm_password"
                            placeholder="Confirm your new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirm-password"
                            aria-label="Show or hide password"
                        >
                            👁
                        </button>

                    </div>

                </div>



                <!-- Status / Error Message -->

                <p
                    class="form-status"
                    id="form-status"
                    aria-live="polite"
                ></p>



                <!-- Reset Button -->

                <button
                    type="submit"
                    class="login-button"
                    id="submit-btn"
                >
                    Reset Password
                </button>


            </form>



            <!-- =====================================
                 BACK TO SIGN IN
            ====================================== -->

            <div class="signup-section">

                <span>
                    Remember your password?
                </span>

                <a href="signin.html">
                    Sign in
                </a>

            </div>


        </div>


    </main>



    <!-- =====================================
         RESET PASSWORD JAVASCRIPT
    ====================================== -->

    <script>

        (function () {


            const form =
                document.getElementById('reset-form');


            const statusEl =
                document.getElementById('form-status');


            const submitBtn =
                document.getElementById('submit-btn');


            const identifierInput =
                document.getElementById('identifier');


            const newPasswordInput =
                document.getElementById('new-password');


            const confirmPasswordInput =
                document.getElementById('confirm-password');



            /* =====================================
               SHOW / HIDE PASSWORD
            ====================================== */

            document
                .querySelectorAll('.password-toggle')
                .forEach((button) => {


                    button.addEventListener(
                        'click',
                        () => {


                            const targetId =
                                button.getAttribute(
                                    'data-target'
                                );


                            const input =
                                document.getElementById(
                                    targetId
                                );


                            if (!input) {
                                return;
                            }


                            const isHidden =
                                input.type === 'password';


                            input.type =
                                isHidden
                                    ? 'text'
                                    : 'password';


                            button.textContent =
                                isHidden
                                    ? '🙈'
                                    : '👁';


                        }
                    );


                });



            /* =====================================
               CHECK PASSWORD MATCH
            ====================================== */

            const checkMatch = () => {


                const mismatch =

                    confirmPasswordInput.value.length > 0 &&

                    confirmPasswordInput.value !==
                    newPasswordInput.value;


                confirmPasswordInput.style.borderColor =
                    mismatch
                        ? '#e8543c'
                        : '';


            };


            newPasswordInput.addEventListener(
                'input',
                checkMatch
            );


            confirmPasswordInput.addEventListener(
                'input',
                checkMatch
            );



            /* =====================================
               STATUS MESSAGE
            ====================================== */

            const showStatus = (
                message,
                isError
            ) => {


                statusEl.textContent =
                    message;


                statusEl.className =

                    'form-status ' +

                    (
                        isError
                            ? 'form-status--error'
                            : 'form-status--success'
                    );


            };



            /* =====================================
               SUBMIT RESET PASSWORD
            ====================================== */

            form.addEventListener(
                'submit',
                async (event) => {


                    event.preventDefault();



                    const identifier =
                        identifierInput
                            .value
                            .trim();


                    const newPassword =
                        newPasswordInput
                            .value
                            .trim();


                    const confirmPassword =
                        confirmPasswordInput
                            .value
                            .trim();



                    /* Check empty fields */

                    if (
                        !identifier ||
                        !newPassword ||
                        !confirmPassword
                    ) {


                        showStatus(
                            'Please fill in all fields.',
                            true
                        );


                        return;
                    }



                    /* Check passwords match */

                    if (
                        newPassword !==
                        confirmPassword
                    ) {


                        showStatus(
                            'Passwords do not match.',
                            true
                        );


                        confirmPasswordInput
                            .style
                            .borderColor =
                                '#e8543c';


                        return;
                    }



                    /* Check password length */

                    if (
                        newPassword.length < 8
                    ) {


                        showStatus(
                            'Password must contain at least 8 characters.',
                            true
                        );


                        return;
                    }



                    const originalText =
                        submitBtn.textContent;



                    submitBtn.disabled =
                        true;


                    submitBtn.textContent =
                        'Resetting...';


                    showStatus(
                        '',
                        false
                    );



                    /* =====================================
                       SEND DATA TO PHP
                    ====================================== */

                    try {


                        const body =
                            new URLSearchParams();


                        body.append(
                            'identifier',
                            identifier
                        );


                        body.append(
                            'new_password',
                            newPassword
                        );


                        body.append(
                            'confirm_password',
                            confirmPassword
                        );



                        const response =
                            await fetch(
                                '../backend/forgot_password.php',
                                {

                                    method: 'POST',

                                    headers: {

                                        'Content-Type':
                                            'application/x-www-form-urlencoded'

                                    },

                                    body:
                                        body.toString()

                                }
                            );



                        const data =
                            await response.json();



                        /* =====================================
                           SUCCESS
                        ====================================== */

                        if (data.success) {


                            showStatus(
                                data.message ||
                                'Password reset successfully.',
                                false
                            );


                            form.reset();



                            setTimeout(
                                () => {

                                    window.location.href =
                                        'signin.html';

                                },
                                1800
                            );


                        }


                        /* =====================================
                           BACKEND ERROR
                        ====================================== */

                        else {


                            showStatus(
                                data.message ||
                                'Unable to reset password.',
                                true
                            );


                        }


                    }


                    /* =====================================
                       CONNECTION / SERVER ERROR
                    ====================================== */

                    catch (error) {


                        console.error(
                            'Reset password error:',
                            error
                        );


                        showStatus(
                            'Something went wrong. Please try again.',
                            true
                        );


                    }


                    finally {


                        submitBtn.disabled =
                            false;


                        submitBtn.textContent =
                            originalText;


                    }


                }
            );


        })();

    </script>


</body>

</html>
