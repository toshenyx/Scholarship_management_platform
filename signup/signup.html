<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up | Scholarly</title>

    <link
        rel="stylesheet"
        href="signup.css"
    >
</head>


<body>

    <main class="signup-page">
        <a
            href="../landing/landing.html"
            class="signup-brand"
        >
            <img
                src="../images/logo3.png"
                alt="Scholarly logo"
                class="signup-logo"
            >

            <span class="brand-name">
                scholarly
            </span>
        </a>


        <!-- =====================================
             SIGNUP CARD
        ====================================== -->

        <div class="signup-card">

            <div class="signup-header">

                <h1>
                    Create an Account
                </h1>

                <p>
                    Join Scholarly and start discovering
                    opportunities made for you.
                </p>

            </div>


            <!-- Signup Form -->

            <form
                action="../backend/signup.php"
                method="POST"
            >

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Signup Button -->

                <button
                    type="submit"
                    class="signup-button"
                >
                    Sign Up
                </button>

            </form>

            <div class="signin-section">

                <span>
                    Already have an account?
                </span>

                <a href="../signin/signin.html">
                    Sign in
                </a>

            </div>

        </div>

    </main>


    <script
        src="../home/script.js"
        defer
    ></script>

</body>

</html>
