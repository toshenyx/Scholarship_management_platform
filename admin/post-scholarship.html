            <header class="admin-header">

                    <h1>
                        Post Scholarship
                    </h1>

                    <p>
                        Scholarships posted by an administrator
                        are approved immediately.
                    </p>

                </div>

            </header>


            <section class="admin-card">


                <form class="admin-form" action="../backend/post_scholarship.php" method="POST">


                    <div class="form-group">

                        <label>
                            Scholarship Title
                        </label>

                        <input type="text" name="title" required>

                    </div>



                    <div class="form-group">

                        <label>
                            Provider
                        </label>

                        <input type="text" name="provider" required>

                    </div>



                    <div class="form-group full">

                        <label>
                            Application Link
                        </label>

                        <input type="url" name="application_link" placeholder="https://..." required>

                    </div>



                    <div class="form-group full">

                        <label>
                            Description
                        </label>

                        <textarea name="description"></textarea>

                    </div>



                    <div class="form-group">

                        <label>
                            Education Level
                        </label>

                        <input type="text" name="education_level" placeholder="Bachelor, Master, PhD" required>

                    </div>



                    <div class="form-group">

                        <label>
                            Eligible Courses
                        </label>

                        <input type="text" name="eligible_courses" placeholder="Computer Science, IT..." required>

                    </div>



                    <div class="form-group">

                        <label>
                            Minimum GPA
                        </label>

                        <input type="number" name="minimum_gpa" step="0.01" min="0">

                    </div>



                    <div class="form-group">

                        <label>
                            Eligible Nationalities
                        </label>

                        <input type="text" name="eligible_nationalities" placeholder="International Students" required>

                    </div>



                    <div class="form-group">

                        <label>
                            Age Limit
                        </label>

                        <input type="number" name="age_limit" min="0">

                    </div>



                    <div class="form-group">

                        <label>
                            IELTS Required?
                        </label>

                        <select name="ielts_required">

                            <option value="0">
                                No
                            </option>

                            <option value="1">
                                Yes
                            </option>

                        </select>

                    </div>



                    <div class="form-group">

                        <label>
                            Funding Type
                        </label>

                        <select name="funding_type" required>

                            <option value="">
                                Select funding
                            </option>

                            <option value="fully_funded">
                                Fully Funded
                            </option>

                            <option value="partially_funded">
                                Partially Funded
                            </option>

                            <option value="tuition_only">
                                Tuition Only
                            </option>

                        </select>

                    </div>



                    <div class="form-group">

                        <label>
                            Country
                        </label>

                        <input type="text" name="country" required>

                    </div>



                    <div class="form-group">

                        <label>
                            University
                        </label>

                        <input type="text" name="university">

                    </div>



                    <div class="form-group">

                        <label>
                            Duration
                        </label>

                        <input type="text" name="duration" placeholder="4 Years">

                    </div>



                    <div class="form-group">

                        <label>
                            Deadline
                        </label>

                        <input type="date" name="deadline" required>

                    </div>



                    <div class="form-group full">

                        <label>
                            Scholarship Benefits
                        </label>


                        <div class="checkbox-group">

                            <label>
                                <input type="checkbox" name="benefits[]" value="tuition">
                                Tuition
                            </label>


                            <label>
                                <input type="checkbox" name="benefits[]" value="accommodation">
                                Accommodation
                            </label>


                            <label>
                                <input type="checkbox" name="benefits[]" value="monthly_stipend">
                                Monthly Stipend
                            </label>


                            <label>
                                <input type="checkbox" name="benefits[]" value="airfare">
                                Airfare
                            </label>


                            <label>
                                <input type="checkbox" name="benefits[]" value="medical_insurance">
                                Medical Insurance
                            </label>


                            <label>
                                <input type="checkbox" name="benefits[]" value="books_allowance">
                                Books Allowance
                            </label>

                        </div>

                    </div>



                    <div class="form-group full">

                        <button type="submit" class="btn btn-primary">
                            Publish Scholarship
                        </button>

                    </div>


                </form>
